name: BBQ Scraper Production

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 */3 * *'   # Runs every 3 days at 6 AM

permissions:
  contents: write

concurrency:
  group: bbq-production
  cancel-in-progress: false


jobs:

# -------------------------
# SCRAPERS (parallel)
# -------------------------
  scraper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        batch:
          - "0 12"
          - "12 24"
          - "24 36"
          - "36 48"
          - "48 50"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT for proper git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run scraper
        run: |
          start=$(echo ${{ matrix.batch }} | cut -d' ' -f1)
          end=$(echo ${{ matrix.batch }} | cut -d' ' -f2)
          python main_prod.py $start $end

      - uses: actions/upload-artifact@v4
        with:
          name: json_${{ matrix.batch }}
          path: json/


# -------------------------
# MERGER
# -------------------------  
  merger:
    needs: scraper
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CLEANUP STEP (CRITICAL FIX)
      - name: Clean old JSON files
        run: |
          echo "🧹 Cleaning old JSON files..."
          rm -rf json
          mkdir json
          echo "✅ Cleanup done"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: json_artifacts

      - name: Move JSON files
        run: |
          find json_artifacts -name "*.json" -exec cp {} json/ \;

      - name: Show generated files (DEBUG)
        run: |
          echo "📂 Files after merge:"
          ls -l json/

      - name: Run merger
        run: | 
          python merger.py || { echo "❌ Merger failed"; exit 1; }

      # CORRECT GIT FLOW
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      
          git add json/
      
          git diff --cached --quiet || git commit -m "Auto update buffet data"
      
          git pull origin main --rebase
      
          git push origin main
