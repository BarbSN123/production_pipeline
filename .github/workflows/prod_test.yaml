name: BBQ Scraper Production

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 */3 * *'

permissions:
  contents: write

concurrency:
  group: bbq-production
  cancel-in-progress: false


jobs:

# -------------------------
# SCRAPERS (parallel)
# -------------------------
  scraper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        batch:
          - "0 12"
          - "12 24"
          - "24 36"
          - "36 48"
          - "48 50"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run scraper
        run: |
          start=$(echo "${{ matrix.batch }}" | cut -d' ' -f1)
          end=$(echo "${{ matrix.batch }}" | cut -d' ' -f2)

          export START_DATE=$(date +%Y-%m-%d)
          export END_DATE=$(date +%Y-%m-%d)
          
          python main_prod.py $start $end
          
      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: json_${{ matrix.batch }}_${{ github.run_id }}
          path: json/


# -------------------------
# MERGER
# -------------------------
  merger:
    needs: scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔥 STEP 1: REMOVE OLD FILES FROM REPO FIRST
      - name: Remove old repo JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -r -f --ignore-unmatch json || true
          mkdir -p json
          echo "✅ Old repo json removed"

      # 🧹 STEP 2: CLEAN LOCAL
      - name: Clean local JSON
        run: |
          rm -rf json
          mkdir json
          echo "✅ Local json cleaned"
      
      # STEP 3.1: Clean temp files
      - name: Clean temp_data
        run: rm -rf temp_data || true
        
      # 📥 STEP 3: DOWNLOAD NEW DATA
      - name: Download artifacts (current only)
        uses: actions/download-artifact@v4
        with:
          path: temp_data
          merge-multiple: false

      # 📦 STEP 4: MOVE FILES
      - name: Move JSON files
        run: |
          find temp_data -name "*.json" -exec mv {} json/ \;
          rm -rf temp_data
          echo "✅ New files ready"

      # 🔍 DEBUG
      - name: Show files
        run: ls -l json/

      # 🧠 STEP 5: MERGE ONLY NEW FILES
      - name: Run merger
        run: python merger.py

      # 🚀 STEP 6: PUSH CLEAN DATA
      - name: Commit & Push
        run: |
          git add json/
          git diff --cached --quiet || git commit -m "Auto update buffet data"
          git push origin main
