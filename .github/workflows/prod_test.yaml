name: BBQ Scraper Production

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 */3 * *'   # Runs every 3 days at 6 AM

permissions:
  contents: write

concurrency:
  group: bbq-production
  cancel-in-progress: false


jobs:

# -------------------------
# SCRAPERS (parallel)
# -------------------------
  scraper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        batch:
          - "0 12"
          - "12 24"
          - "24 36"
          - "36 48"
          - "48 50"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: |
          start=$(echo "${{ matrix.batch }}" | cut -d' ' -f1)
          end=$(echo "${{ matrix.batch }}" | cut -d' ' -f2)
          python main_prod.py $start $end

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: json_${{ matrix.batch }}
          path: json/


# -------------------------
# MERGER
# -------------------------
  merger:
    needs: scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ CLEAN OLD FILES
      - name: Clean old JSON files
        run: |
          echo "🧹 Cleaning old JSON files..."
          rm -rf json
          mkdir json
          echo "✅ Cleanup done"

      # ✅ DOWNLOAD ARTIFACTS
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: json_artifacts

      # ✅ MOVE FILES
      - name: Move JSON files
        run: |
          if [ -d "json_artifacts" ]; then
            find json_artifacts -name "*.json" -exec cp {} json/ \;
          else
            echo "❌ No artifacts found!"
            exit 1
          fi

      # ✅ DEBUG
      - name: Show generated files
        run: |
          echo "📂 Files after merge:"
          ls -l json/

      # ✅ RUN MERGER SCRIPT
      - name: Run merger
        run: |
          python merger.py || { echo "❌ Merger failed"; exit 1; }

      # ✅ FINAL GIT (BULLETPROOF)
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Stage EVERYTHING (important for deletions)
          git add -A

          # Commit only if changes exist
          git diff --cached --quiet || git commit -m "Auto update buffet data"

          # Pull safely (ignore minor rebase issues)
          git pull --rebase origin main || true

          # Push changes
          git push origin main
