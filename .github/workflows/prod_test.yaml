name: BBQ Scraper Production

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 */3 * *'

permissions:
  contents: write

concurrency:
  group: bbq-production
  cancel-in-progress: false


jobs:

# -------------------------
# SCRAPERS (parallel)
# -------------------------
  scraper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        batch:
          - "0 12"
          - "12 24"
          - "24 36"
          - "36 48"
          - "48 50"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: |
          start=$(echo "${{ matrix.batch }}" | cut -d' ' -f1)
          end=$(echo "${{ matrix.batch }}" | cut -d' ' -f2)
          python main_prod.py $start $end

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: json_${{ matrix.batch }}
          path: json/


# -------------------------
# MERGER
# -------------------------
  merger:
    needs: scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🧹 DELETE OLD DATA
      - name: Clean old JSON files
        run: |
          rm -rf json
          mkdir json
          echo "✅ Old json cleared"

      # 📥 DOWNLOAD ARTIFACTS
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp_data

      # 📦 MOVE FILES INTO json/
      - name: Move JSON files
        run: |
          find temp_data -name "*.json" -exec mv {} json/ \;
          rm -rf temp_data
          echo "✅ Files moved & temp cleaned"

      # 🔍 DEBUG (optional but useful)
      - name: Show files
        run: |
          echo "Final JSON files:"
          ls -l json/

      # 🧠 RUN MERGER
      - name: Run merger
        run: python merger.py

      # 🚀 PUSH TO REPO (FINAL CLEAN STEP)
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A

          git diff --cached --quiet || git commit -m "Auto update buffet data"

          git push origin main
