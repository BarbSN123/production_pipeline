name: BBQ Scraper Production

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # every hour

permissions:
  contents: write

concurrency:
  group: bbq-production
  cancel-in-progress: false

jobs:

# -------------------------
# CONTROLLER
# -------------------------
  controller:
    runs-on: ubuntu-latest
    outputs:
      run_scraper: ${{ steps.random.outputs.run }}

    steps:
      - name: Decide whether to run scraper
        id: random
        run: |
          r=$((RANDOM % 100))
          echo "Random number: $r"
          if [ $r -lt 15 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi


# -------------------------
# SCRAPER 1
# -------------------------
  scraper_1:
    needs: controller
    if: needs.controller.outputs.run_scraper == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run scraper batch 1
        run: python main_prod.py 0 12

      - uses: actions/upload-artifact@v4
        with:
          name: json_batch1
          path: json/


# -------------------------
# SCRAPER 2
# -------------------------
  scraper_2:
    needs: controller
    if: needs.controller.outputs.run_scraper == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run scraper batch 2
        run: python main_prod.py 12 24

      - uses: actions/upload-artifact@v4
        with:
          name: json_batch2
          path: json/


# -------------------------
# SCRAPER 3
# -------------------------
  scraper_3:
    needs: controller
    if: needs.controller.outputs.run_scraper == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run scraper batch 3
        run: python main_prod.py 24 36

      - uses: actions/upload-artifact@v4
        with:
          name: json_batch3
          path: json/


# -------------------------
# SCRAPER 4
# -------------------------
  scraper_4:
    needs: controller
    if: needs.controller.outputs.run_scraper == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run scraper batch 4
        run: python main_prod.py 36 48

      - uses: actions/upload-artifact@v4
        with:
          name: json_batch4
          path: json/


# -------------------------
# SCRAPER 5
# -------------------------
  scraper_5:
    needs: controller
    if: needs.controller.outputs.run_scraper == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run scraper batch 5
        run: python main_prod.py 48 50

      - uses: actions/upload-artifact@v4
        with:
          name: json_batch5
          path: json/


# -------------------------
# MERGER
# -------------------------
  merger:
    needs:
      - scraper_1
      - scraper_2
      - scraper_3
      - scraper_4
      - scraper_5
    runs-on: ubuntu-latest

    if: |
      needs.scraper_1.result == 'success' &&
      needs.scraper_2.result == 'success' &&
      needs.scraper_3.result == 'success' &&
      needs.scraper_4.result == 'success' &&
      needs.scraper_5.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: json_artifacts

      - name: Move JSON files
        run: |
          mkdir -p json
          find json_artifacts -name "*.json" -exec cp {} json/ \;

      - name: Run merger
        run: python merger.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git pull --rebase origin main

          git add json/

          git commit -m "Auto update buffet data" || echo "No changes to commit"

          git push origin main
