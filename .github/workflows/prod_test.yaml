- name: Clean json directory
  run: |
    echo "🧹 Cleaning json directory..."

    # Remove all files inside json
    rm -rf json/*

    # Recreate folder (safety)
    mkdir -p json

    # Keep folder tracked by git
    touch json/.keep

    git add -A
    git commit -m "Auto साफ: cleaned json directory" || echo "Nothing to commit"
    git push
